# Copy this file to .github/workflows/telegram-notify.yml in any repository.
#
# Required repository secrets:
#   TELEGRAM_TOKEN  bot token from @BotFather
#   TELEGRAM_TO     chat id (or @channel_name) that should receive the messages
#
# See https://github.com/AmineMabrouk17/telegram-ci-notify for the full guide.
name: Telegram Notify

on:
  workflow_dispatch:
  push:
  create:
  delete:
  pull_request:
    types:
      - opened
      - reopened
      - synchronize
      - closed
      - ready_for_review
      - converted_to_draft
      - labeled
      - unlabeled
  pull_request_review:
    types:
      - submitted
  issue_comment:
    types:
      - created
  release:
    types:
      - published

permissions:
  contents: read

# One notification per event target, so a burst of pushes cannot flood the chat.
concurrency:
  group: telegram-${{ github.event_name }}-${{ github.event.pull_request.number || github.event.issue.number || github.ref }}
  cancel-in-progress: false

jobs:
  notify:
    name: Telegram
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: AmineMabrouk17/telegram-ci-notify@v1
        # Optional. Every input has a sane default; delete what you do not need.
        # with:
        #   # Only ring the phone for PRs you have to act on (this is the default).
        #   silent: auto
        #   # Show a friendly name instead of owner/repo in the message.
        #   project-name: My Project
        #   # Preview + Screenshots buttons: the pattern is filled per PR.
        #   preview-url-template: https://pr-{number}-my-worker.my-subdomain.workers.dev
        #   images-url-template: https://image.thum.io/get/width/1200/crop/900/{preview_url}
        #   # Debug without sending anything:
        #   dry-run: true
        env:
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_TO: ${{ secrets.TELEGRAM_TO }}
