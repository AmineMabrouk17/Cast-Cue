name: Telegram Notification

on:
  workflow_dispatch:
  push:
  create:
  delete:
  pull_request:
    types:
      - opened
      - reopened
      - synchronize
      - closed
      - ready_for_review
      - converted_to_draft
      - labeled
      - unlabeled
  pull_request_review:
    types:
      - submitted
  issue_comment:
    types:
      - created
  release:
    types:
      - published

permissions:
  contents: read

concurrency:
  group: telegram-${{ github.event_name }}-${{ github.event.pull_request.number || github.event.issue.number || github.ref }}
  cancel-in-progress: false

jobs:
  notify:
    name: Send Telegram notification
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Verify notification secrets are configured
        id: secrets_check
        env:
          BOT_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          CHAT_ID: ${{ secrets.TELEGRAM_TO }}
        run: |
          if [ -n "$BOT_TOKEN" ] && [ -n "$CHAT_ID" ]; then
            echo "configured=true" >> "$GITHUB_OUTPUT"
          else
            echo "configured=false" >> "$GITHUB_OUTPUT"
            echo "::warning::TELEGRAM_TOKEN and/or TELEGRAM_TO are not set; skipping Telegram notification."
          fi

      - name: Send Telegram notification
        if: steps.secrets_check.outputs.configured == 'true'
        env:
          BOT_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          CHAT_ID: ${{ secrets.TELEGRAM_TO }}
          EVENT_NAME: ${{ github.event_name }}
          EVENT_ACTION: ${{ github.event.action }}
          ACTOR: ${{ github.actor }}
          REPO: ${{ github.repository }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          set -euo pipefail
          payload="${GITHUB_EVENT_PATH}"
          short() { cut -c1-7; }
          clean() { tr '\n' ' ' | sed 's/[[:space:]]\+/ /g' | cut -c1-180; }

          case "$EVENT_NAME" in
            push)
              branch="${GITHUB_REF_NAME}"
              sha=$(jq -r '.head_commit.id // .after // ""' "$payload" | short)
              message=$(jq -r '.head_commit.message // ""' "$payload" | head -n 1)
              commit_url=$(jq -r '.head_commit.url // ""' "$payload")
              compare=$(jq -r '.compare // ""' "$payload")
              TEXT=$(printf '📦 %s\n🔀 Push · %s\n👤 %s · %s\n%s\n%s\n%s' \
                "$REPO" "$branch" "$ACTOR" "$sha" "$message" "$commit_url" "$compare")
              ;;
            pull_request)
              action="${EVENT_ACTION:-}"
              number=$(jq -r '.pull_request.number // ""' "$payload")
              title=$(jq -r '.pull_request.title // ""' "$payload")
              url=$(jq -r '.pull_request.html_url // ""' "$payload")
              head=$(jq -r '.pull_request.head.ref // ""' "$payload")
              base=$(jq -r '.pull_request.base.ref // ""' "$payload")
              commits=$(jq -r '.pull_request.commits // ""' "$payload")
              adds=$(jq -r '.pull_request.additions // ""' "$payload")
              dels=$(jq -r '.pull_request.deletions // ""' "$payload")
              sha=$(jq -r '.pull_request.head.sha // ""' "$payload" | short)
              merged=$(jq -r '.pull_request.merged // false' "$payload")
              if [ "$action" = "closed" ] && [ "$merged" = "true" ]; then action="merged"; fi
              if [ "$action" = "synchronize" ]; then
                action="new commits ($sha)"
              fi
              label=$(jq -r '.label.name // ""' "$payload")
              if [ -n "$label" ]; then action="$action · $label"; fi
              TEXT=$(printf '📦 %s\n🔀 PR #%s · %s\n%s\n%s → %s\n👤 %s\n+%s −%s · %s commits\n%s\n%s' \
                "$REPO" "$number" "$action" "$title" "$head" "$base" "$ACTOR" "$adds" "$dels" "$commits" "$url" "$RUN_URL")
              ;;
            pull_request_review)
              state=$(jq -r '.review.state // ""' "$payload" | tr '_' ' ')
              number=$(jq -r '.pull_request.number // ""' "$payload")
              title=$(jq -r '.pull_request.title // ""' "$payload")
              url=$(jq -r '.review.html_url // .pull_request.html_url // ""' "$payload")
              TEXT=$(printf '📦 %s\n👀 Review %s on PR #%s\n%s\n👤 %s\n%s\n%s' \
                "$REPO" "$state" "$number" "$title" "$ACTOR" "$url" "$RUN_URL")
              ;;
            issue_comment)
              is_pr=$(jq -r '.issue.pull_request.url // ""' "$payload")
              if [ -z "$is_pr" ]; then
                echo "Issue comment is not on a pull request; skipping."
                exit 0
              fi
              number=$(jq -r '.issue.number // ""' "$payload")
              title=$(jq -r '.issue.title // ""' "$payload")
              excerpt=$(jq -r '.comment.body // ""' "$payload" | clean)
              url=$(jq -r '.comment.html_url // ""' "$payload")
              TEXT=$(printf '📦 %s\n💬 Comment on PR #%s\n%s\n👤 %s\n“%s”\n%s\n%s' \
                "$REPO" "$number" "$title" "$ACTOR" "$excerpt" "$url" "$RUN_URL")
              ;;
            create|delete)
              ref_type=$(jq -r '.ref_type // ""' "$payload")
              ref=$(jq -r '.ref // ""' "$payload")
              TEXT=$(printf '📦 %s\n🌿 %s %s · %s\n👤 %s\n%s' \
                "$REPO" "$ref_type" "$EVENT_NAME" "$ref" "$ACTOR" "$RUN_URL")
              ;;
            release)
              tag=$(jq -r '.release.tag_name // ""' "$payload")
              name=$(jq -r '.release.name // ""' "$payload")
              url=$(jq -r '.release.html_url // ""' "$payload")
              TEXT=$(printf '📦 %s\n🏷️ Release %s · %s\n👤 %s\n%s\n%s' \
                "$REPO" "$tag" "$name" "$ACTOR" "$url" "$RUN_URL")
              ;;
            workflow_dispatch)
              TEXT=$(printf '📦 %s\n🧪 Manual Telegram test\n👤 %s\n%s' \
                "$REPO" "$ACTOR" "$RUN_URL")
              ;;
            *)
              TEXT=$(printf '📦 %s\n%s by %s\n%s' "$REPO" "$EVENT_NAME" "$ACTOR" "$RUN_URL")
              ;;
          esac

          TEXT=$(printf '%s' "$TEXT" | cut -c1-3500)

          RESPONSE=$(curl -fsS "https://api.telegram.org/bot${BOT_TOKEN}/sendMessage" \
            --data-urlencode "chat_id=${CHAT_ID}" \
            --data-urlencode "text=${TEXT}" \
            --data-urlencode "disable_web_page_preview=true")
          echo "$RESPONSE"
          echo "$RESPONSE" | grep -q '"ok":true'
